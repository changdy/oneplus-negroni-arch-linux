# OnePlus 10 Pro (negroni). PCM numbers are the topology frontends:
#   hw:0 MultiMedia1 -> RX_CODEC_DMA_RX_0 (WCD9385 headphones)
#   hw:1 MultiMedia2 -> TERTIARY_MI2S_RX  (2x TFA9874 speakers)
#   hw:2 MultiMedia3 <- TX_CODEC_DMA_TX_3 (DMIC3/4 or headset mic, stereo only)
SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='TERTIARY_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones (USB-C analog adapter)"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic1" {
	Comment "Internal Microphone"

	# Stock handset-mic: DEC0 <- DMIC3, DEC1 <- DMIC4, both at 0 dB.
	EnableSequence [
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX0' DMIC3"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX1' DMIC4"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX DMIC MUX0' ZERO"
		cset "name='TX DMIC MUX1' ZERO"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}

SectionDevice."Mic2" {
	Comment "Headset Microphone"

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
		JackHWMute "Mic1"
	}
}
