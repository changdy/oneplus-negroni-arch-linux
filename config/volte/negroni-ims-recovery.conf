# IMS bearer recovery for VoLTE. All values are seconds or counts.
# After two consecutive checks without a connected IMS bearer, restart 81voltd
# so the modem asks for its IMS connection again.
CHECK_INTERVAL=15
FAILURES_BEFORE_RESTART=2
RESTART_COOLDOWN=30

# Restarting ModemManager reconnects mobile data and interrupts calls.
# It is only used while another data bearer is up, at most twice per boot.
# Set ALLOW_MODEMMANAGER_RESTART=0 to disable it entirely.
MM_RESTART_AFTER=6
ALLOW_MODEMMANAGER_RESTART=1
MM_RESTART_COOLDOWN=300
MAX_MODEMMANAGER_RESTARTS=2
