name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: IMAGE_VERSION
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Detect a new image version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat IMAGE_VERSION)
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            previous=$(git show "$BEFORE:IMAGE_VERSION" 2>/dev/null || true)
            if [[ $version == "$previous" ]]; then
              echo 'The image version did not change.'
              exit 0
            fi
          fi
          if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error file=IMAGE_VERSION::Expected a version like 0.1.0.'
            exit 1
          fi
          current=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/IMAGE_VERSION?ref=main")
          if [[ $version != "$current" ]]; then
            echo 'A newer image version is already on main.'
            exit 0
          fi
          echo "tag=image-v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    concurrency:
      group: negroni-image-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate the root account password
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import secrets

          with open("image-credentials.json", "x", encoding="utf-8") as stream:
              json.dump({"root_password": secrets.token_urlsafe(24)}, stream)
          PY
      - name: Free disk space and install build dependencies
        run: |
          df -h .
          # Only these preinstalled SDKs are removed from the disposable VM.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 build-essential bc cpio kmod rsync zstd xz-utils \
            e2fsprogs util-linux file gcc-aarch64-linux-gnu flex bison libssl-dev libelf-dev \
            device-tree-compiler pahole qemu-user qemu-user-binfmt binfmt-support \
            mkbootimg android-sdk-libsparse-utils
          sudo apt-get clean
          df -h . "$RUNNER_TEMP" /tmp
      - name: Restore the kernel and download the Arch Linux ARM bootstrap
        run: |
          bash scripts/init-submodules.sh
          mkdir -p downloads
          base=https://ca.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          curl --fail --location --retry 4 --output downloads/ArchLinuxARM-aarch64-latest.tar.gz "$base"
          curl --fail --location --retry 4 --output downloads/ArchLinuxARM-aarch64-latest.tar.gz.md5 "$base.md5"
          (cd downloads && md5sum -c ArchLinuxARM-aarch64-latest.tar.gz.md5)
      - name: Build and verify the image
        env:
          JOBS: '4'
        run: |
          trap 'df -h . "$RUNNER_TEMP" /tmp' EXIT
          time bash build.sh 7.3
          (cd images/7.3 && sha256sum -c SHA256SUMS)
      - name: Compress the release assets
        run: bash scripts/prepare-image-release.sh images/7.3 logs/7.3 "$RUNNER_TEMP/image-release"
      - name: Transfer the image to the release job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.version.outputs.tag }}
          path: ${{ runner.temp }}/image-release/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: negroni-image-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            IMAGE_VERSION
            scripts/publish-image-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.version.outputs.tag }}
          path: ${{ runner.temp }}/image-release/
      - name: Publish the release and commit notes
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.version.outputs.tag }}
        run: bash scripts/publish-image-release.sh "$IMAGE_TAG" "$RUNNER_TEMP/image-release"
